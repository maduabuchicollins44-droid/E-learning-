{% extends 'academy/base.html' %}

{% block title %}Submit Complaint | Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-3 text-success">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i>Lodge a Complaint / Feedback
                </h3>
                <p class="text-muted small">Have an issue or inquiry? Submit your complaint below and the administration will review it.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Subject</label>
                        <input type="text" name="subject" class="form-control" placeholder="e.g. Cannot access course video" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Message Detail</label>
                        <textarea name="message" class="form-control" rows="5" placeholder="Describe the issue in detail..." required></textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{% url 'my_complaints' %}" class="btn btn-outline-secondary btn-sm">View My Complaints</a>
                        <button type="submit" class="btn btn-success fw-bold px-4">Submit Report</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
